name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # dependabot_merge re-runs CI on a Dependabot branch after pushing gemset.nix:
  # pushes made with GITHUB_TOKEN don't start runs, and the ruleset needs lint
  # and test on the new head.
  workflow_dispatch:

jobs:
  brakeman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run tests
        run: bin/rails test

  nix_build:
    # Dependabot PRs are built in dependabot_merge.
    if: github.actor != 'dependabot[bot]' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check gemset.nix is up to date
        run: |
          nix develop -c bundix
          if ! git diff --exit-code gemset.nix; then
            echo "::error::gemset.nix is stale; run 'nix run nixpkgs#bundix' and commit the result"
            exit 1
          fi

      - name: Build the default package
        run: nix build .#default --no-link -L

  dependabot_merge:
    needs: [brakeman, lint, test]
    if: >-
      (github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'dependabot/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Dependabot doesn't update gemset.nix. If it is stale, push the fix and
      # re-run CI on the new head; that run merges.
      - name: Regenerate gemset.nix
        id: gemset
        run: |
          nix develop -c bundix
          if ! git diff --quiet gemset.nix; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate gemset.nix" gemset.nix
            git push
            gh workflow run ci.yml --ref "$BRANCH"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the default package
        if: steps.gemset.outputs.pushed != 'true'
        run: nix build .#default --no-link -L

      - name: Merge and trigger deploy
        if: steps.gemset.outputs.pushed != 'true'
        run: |
          gh pr merge --merge --match-head-commit "$(git rev-parse HEAD)" "$BRANCH"
          # Merges made with GITHUB_TOKEN don't fire push events; dispatch is exempt.
          gh workflow run deploy.yaml --ref main
