name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  brakeman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run tests
        run: bin/rails test

  nix_build:
    # Dependabot PRs are built in dependabot_merge.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check gemset.nix is up to date
        run: |
          nix develop -c bundix
          if ! git diff --exit-code gemset.nix; then
            echo "::error::gemset.nix is stale; run 'nix run nixpkgs#bundix' and commit the result"
            exit 1
          fi

      - name: Build the default package
        run: nix build .#default --no-link -L

  dependabot_merge:
    needs: [brakeman, lint, test]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Dependabot doesn't update gemset.nix.
      - name: Regenerate gemset.nix
        run: |
          nix develop -c bundix
          if ! git diff --quiet gemset.nix; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate gemset.nix" gemset.nix
            git push
          fi

      - name: Build the default package
        run: nix build .#default --no-link -L

      - name: Merge and trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Merge exactly what was built if we pushed a commit.
          args=()
          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            args+=(--match-head-commit "$(git rev-parse HEAD)")
          fi
          gh pr merge --merge "${args[@]}" "$PR_URL"
          # Merges made with GITHUB_TOKEN don't fire push events; dispatch is exempt.
          gh workflow run deploy.yaml --ref main
